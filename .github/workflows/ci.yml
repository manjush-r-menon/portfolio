name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # URLs, the server-start command, and run count all live in
      # .lighthouserc.json / .lighthouserc.mobile.json (each an @lhci/cli
      # config, not action inputs) — desktop and mobile-throttled profiles,
      # run as two separate steps since one lhci config can't mix presets
      # per-URL. Both cover all 7 real routes, including /gallery, the
      # heaviest one. Still informational only — no assert block in either
      # config, so scores show up on the PR check and in the uploaded
      # report, but nothing fails the build on a low score yet. Tighten
      # into assertions once there's a baseline worth holding the site to
      # (at that point /gallery will likely need its own, more lenient
      # thresholds — its WebGL/texture-loading profile isn't comparable to
      # the rest of the site's plain server-rendered pages).
      - name: Lighthouse CI (desktop)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Lighthouse CI (mobile)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.mobile.json
          uploadArtifacts: true
          temporaryPublicStorage: true
